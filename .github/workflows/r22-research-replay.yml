name: R22 research replay

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: r22-research-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase5-zero-gate:
    strategy:
      max-parallel: 1
      matrix:
        mask: [150, 255]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Audit F invertibility on z0-zero branches
        working-directory: experiments
        run: python r22_phase5_invertibility_probe.py --component 5 --mask ${{ matrix.mask }}
      - name: Replay z0-zero branches through final pentagons
        working-directory: experiments
        run: python r22_phase5_zero_branch_probe.py --component 5 --mask ${{ matrix.mask }}

  phase5-finite-gate:
    strategy:
      max-parallel: 1
      matrix:
        mask: [150, 255]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Audit all 18 finite Phase-5 strata
        working-directory: experiments
        run: python r22_phase5_component5_rest_audit.py --component 5 --mask ${{ matrix.mask }}
