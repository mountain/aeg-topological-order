name: R22 research replay

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: r22-research-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-d0a-class0-component7:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Replay coordinate-free class-0 terminal certificates for component 7
        working-directory: experiments
        run: |
          for mask in 0 105 150 255; do
            python r22_phase5_two_cell_certificate.py --component 7 --mask $mask
          done

  replay-d0a-class0-component15:
    needs: replay-d0a-class0-component7
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Replay coordinate-free class-0 terminal certificates for component 15
        working-directory: experiments
        run: |
          for mask in 0 105 150 255; do
            python r22_phase5_two_cell_certificate.py --component 15 --mask $mask
          done
