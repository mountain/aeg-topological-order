name: R22 research replay

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: r22-research-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  theorem-gate-second-sheet-phase5-component5-mask105-sparse-residual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Compile one exact class-1 sign-specialized residual
        working-directory: experiments
        run: python r22_phase5_component5_torsion_sparse_residual.py --component 5 --mask 105 --a 2 --b 1 --root positive --sign 1
