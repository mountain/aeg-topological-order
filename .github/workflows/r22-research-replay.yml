          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Replay class-0 parametric F gate component 5
        working-directory: experiments
        run: python r22_epsminus_f_parametric.py --component 5

