name: R22 research replay

on:
  pull_request:
    branches:
      - agent/levin-wen-plaquette-benchmark
  workflow_dispatch:

concurrency:
  group: r22-research-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy
      - name: Run R22 scale audit
        working-directory: experiments
        run: python r22_scale_audit.py
      - name: Run D-layer structural audit
        working-directory: experiments
        run: python r22_d_layer_probe.py
      - name: Run PAL edge-relation geometry
        working-directory: experiments
        run: python r22_pal_edge_geometry.py
      - name: Run fresh epsilon-minus D trace on canonical component 13
        working-directory: experiments
        run: python r22_epsminus_d_trace.py --component 13 --assert-trace
