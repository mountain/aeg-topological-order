name: R22 research replay

on:
  push:
    branches:
      - agent/r22-scale-reduction-audit
  pull_request:
    branches:
      - agent/levin-wen-plaquette-benchmark
  workflow_dispatch:

jobs:
  exact-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy
      - name: Run R22 scale audit
        working-directory: experiments
        run: python r22_scale_audit.py
      - name: Run D-layer structural audit
        working-directory: experiments
        run: python r22_d_layer_probe.py
      - name: Run PAL edge-relation geometry
        working-directory: experiments
        run: python r22_pal_edge_geometry.py
