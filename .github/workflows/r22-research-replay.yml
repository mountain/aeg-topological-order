name: R22 research replay

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: r22-research-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  theorem-gate-second-sheet-component5-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Recheck terminal rank-10 source certificates for component 5 masks 150 and 255
        working-directory: experiments
        run: |
          set -euo pipefail
          python r22_phase5_component5_torsion_mask150_rank10_certificate.py
          python r22_phase5_component5_torsion_mask255_rank10_certificate.py
