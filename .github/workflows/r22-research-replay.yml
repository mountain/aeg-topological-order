name: R22 research replay

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: r22-research-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  theorem-gate-second-sheet-phase5-component5-remaining-finite-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Audit 18 class-1 finite strata for masks 105,150,255
        working-directory: experiments
        run: |
          set -euo pipefail
          for mask in 105 150 255; do
            echo "=== component 5 / mask ${mask} / D class 1 / finite strata ==="
            python r22_phase5_component5_torsion_finite_audit.py --component 5 --mask "${mask}"
          done
