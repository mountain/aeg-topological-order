name: R22 research replay

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: r22-research-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase4-parametric-f:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        component: [5, 7, 13, 15]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Audit E two-parameter torus
        working-directory: experiments
        run: |
          python r22_epsminus_e_gauge_audit.py --component ${{ matrix.component }} --mask 0 --mask 105
      - name: Run parametric F filter on independent chirality classes
        working-directory: experiments
        run: |
          python r22_epsminus_f_parametric.py --component ${{ matrix.component }} --mask 0 --mask 105
