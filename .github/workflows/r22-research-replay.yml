name: R22 research replay

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: r22-research-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  theorem-gate-deep-phase4-f:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Fresh replay all 16 invertible parametric F closures
        working-directory: experiments
        run: |
          python - <<'PY'
          import r22_epsminus_d_amplitude as da
          import r22_epsminus_f_parametric as fp

          passed = []
          for cid in da.FRONTIER_COMPONENTS:
              expected_active = 21 if cid in (5, 13) else 17
              for mask in da.SURVIVOR_MASKS:
                  result = fp.analyze_branch(cid, mask)
                  if result['status'] != 'F_PASS':
                      raise AssertionError(result)
                  if result['F_equations'] != 15744:
                      raise AssertionError(('unexpected F equation count', result))
                  if result['F_support'] != {2: 15744}:
                      raise AssertionError(('unexpected F support profile', result))
                  if result['generic_active_F_components'] != expected_active:
                      raise AssertionError(('unexpected active F component count', result))
                  if not result['passing_E_ratio_strata']:
                      raise AssertionError(('no invertible F stratum', result))
                  passed.append((cid, mask))
          if len(passed) != 16:
              raise AssertionError(passed)
          print({'passed': passed, 'total': len(passed)})
          print('RESULT: all 16 deep branches pass the exact invertible parametric F gate')
          PY
