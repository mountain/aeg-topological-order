name: R22 research replay

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: r22-research-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-d1c0-mask0-local-relations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Fresh source-validate the five-cell class-1 local model
        working-directory: experiments
        run: python r22_phase5_component13_torsion_mask0_local_relations.py

  replay-d1c0-mask0-finite-census:
    needs: replay-d1c0-mask0-local-relations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Rebuild all 18 finite branches and assert the exact 2+4+4+8 stratification
        working-directory: experiments
        run: |
          python - <<'PY'
          import r22_phase5_component13_torsion_mask0_finite_census as fc
          import r22_phase5_monomial_lift as ml
          import r22_phase5_torsion_sheet as ts

          with ts.second_sheet_provider():
              _quotient, unique = ml.compile_unique(fc.CID, fc.MASK)
          rows = [fc.branch_census(unique,a,b,sign) for b in range(3) for a in range(3) for sign in (1,-1)]
          if len(rows) != 18:
              raise AssertionError(('finite branch count',len(rows)))
          by_id = {(r['a'],r['b'],r['sign']):r for r in rows}
          signs = ('+','-')
          for sign in signs:
              if by_id[(0,0,sign)]['consistent']:
                  raise AssertionError(('expected affine inconsistency',by_id[(0,0,sign)]))
          for a in (1,2):
              for sign in signs:
                  r=by_id[(a,0,sign)]
                  if not (r['consistent'] and r['rank']==11 and r['free_dimension']==7 and r['forced_zero_z']==(13,14)):
                      raise AssertionError(('bad p-rank11 branch',r))
          for b in (1,2):
              for sign in signs:
                  r=by_id[(0,b,sign)]
                  if not (r['consistent'] and r['rank']==11 and r['free_dimension']==7 and r['forced_zero_z']==(7,8)):
                      raise AssertionError(('bad q-rank11 branch',r))
          for a in (1,2):
              for b in (1,2):
                  for sign in signs:
                      r=by_id[(a,b,sign)]
                      if not (r['consistent'] and r['rank']==10 and r['free_dimension']==8 and r['forced_zero_z']==()):
                          raise AssertionError(('bad rank10 branch',r))
          print({'component':13,'mask':0,'D_amplitude_class':1,'finite_total':18,'affine_inconsistent':2,'p_rank11':4,'q_rank11':4,'rank10':8})
          print('RESULT: component 13 / mask 0 / D class 1 finite stratification is exactly 18=2+4+4+8')
          PY

  replay-d1c0-mask0-terminal:
    needs: replay-d1c0-mask0-finite-census
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Close all 4+4+8 non-affine finite branches with fixed source cells
        working-directory: experiments
        run: python r22_phase5_component13_torsion_mask0_terminal_certificate.py
