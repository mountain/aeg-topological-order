name: R22 research replay

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: r22-research-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-a1-scalar-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Replay full-complex scalar quotient
        working-directory: experiments
        run: python r22_scalar_component_inventory.py

  replay-a2-epsplus-local-f:
    needs: replay-a1-scalar-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Replay epsilon-plus exhaustive local-F obstruction
        working-directory: experiments
        run: python r22_epsplus_local_f_obstruction.py

  replay-a3-shallow-epsminus-local-f:
    needs: replay-a2-epsplus-local-f
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Replay shallow epsilon-minus local-F obstruction
        working-directory: experiments
        run: python r22_epsminus_shallow_local_f_obstruction.py
