name: R22 research replay

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: r22-research-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-b1-pauli-seed-normal-form:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Replay Pauli seed normal-form completeness
        working-directory: experiments
        run: python r22_epsminus_seed_pauli_normal_form_audit.py

  replay-b2-deep-chirality-traces:
    needs: replay-b1-pauli-seed-normal-form
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Replay all four deep 256-to-4 chirality traces
        working-directory: experiments
        run: |
          python r22_epsminus_d_trace.py --component 5 --assert-trace
          python r22_epsminus_d_trace.py --component 7 --assert-trace
          python r22_epsminus_d_trace.py --component 13 --assert-trace
          python r22_epsminus_d_trace.py --component 15 --assert-trace

  replay-b3-physical-d-quotient:
    needs: replay-b2-deep-chirality-traces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Replay cross-D Smith and connected gauge profile
        working-directory: experiments
        run: python r22_epsminus_d_amplitude_gauge_audit.py
      - name: Replay corrected full physical D-class quotient
        working-directory: experiments
        run: python r22_epsminus_d_physical_class_audit.py
