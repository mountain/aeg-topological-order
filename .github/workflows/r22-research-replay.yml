name: R22 research replay

on:
  pull_request:
    branches:
      - agent/levin-wen-plaquette-benchmark
  workflow_dispatch:

concurrency:
  group: r22-research-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Run R22 scale audit
        working-directory: experiments
        run: python r22_scale_audit.py
      - name: Run D-layer structural audit
        working-directory: experiments
        run: python r22_d_layer_probe.py
      - name: Run PAL edge-relation geometry
        working-directory: experiments
        run: python r22_pal_edge_geometry.py
      - name: Run fresh epsilon-minus D traces on all frontier components
        working-directory: experiments
        run: |
          for cid in 5 7 13 15; do
            echo "=== component ${cid} ==="
            python r22_epsminus_d_trace.py --component "${cid}" --assert-trace
          done
      - name: Close exact D amplitudes on all 16 Phase-1 survivors
        working-directory: experiments
        run: python r22_epsminus_d_amplitude.py
      - name: Run complete E-layer filter on all D survivors
        working-directory: experiments
        run: python r22_epsminus_e_filter.py
      - name: Audit the exact two-parameter E torus
        working-directory: experiments
        run: python r22_epsminus_e_gauge_audit.py
