name: R22 research replay

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: r22-research-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-d0b3-mask255-local-relations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Re-derive all five mask-255 local relations from fixed source cells
        working-directory: experiments
        run: python r22_phase5_component5_local_relations.py --component 5 --mask 255

  replay-d0b3-mask255-zero-closure:
    needs: replay-d0b3-mask255-local-relations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Exclude all z0-zero raw branches before canonicalization
        working-directory: experiments
        run: |
          python - <<'PY'
          import r22_phase5_zero_closure as zc
          summary = zc.audit(5, 255, ['A', 'ZB', 'ZC', 'D'])
          if summary['closed'] != 4 or summary['total'] != 4 or summary['survivors']:
              raise AssertionError(summary)
          print("RESULT: component 5 / mask 255 z0=0 frontier is exhaustively closed")
          PY

  replay-d0b3-mask255-finite-census:
    needs: replay-d0b3-mask255-zero-closure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Rebuild all 18 branches and assert the exact 10+8 split
        working-directory: experiments
        run: |
          python - <<'PY'
          import r22_phase5_component5_rest_audit as fa

          summary = fa.audit_mask(5, 255)
          expected = {
              (a, b, root)
              for (a, b) in ((1,1), (2,1), (1,2), (2,2))
              for root in ('positive', 'negative')
          }
          survivors = {(r['a'], r['b'], r['root']) for r in summary['survivors']}
          expected_profile = {
              '(11, 9, (6, 7, 9, 10))': 10,
              '(10, 10, ())': 8,
          }
          if (
              summary['total'] != 18
              or summary['closed_by_affine_or_7_targets'] != 10
              or survivors != expected
              or summary['rank_profile'] != expected_profile
          ):
              raise AssertionError({
                  'summary': summary,
                  'expected_survivors': sorted(expected),
                  'expected_profile': expected_profile,
              })
          print("RESULT: component 5 / mask 255 finite census is exactly 18=10+8")
          PY

  replay-d0b3-mask255-rankdrop-certificates:
    needs: replay-d0b3-mask255-finite-census
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Close all eight rank-10 branches by the accepted local certificates
        working-directory: experiments
        run: python r22_phase5_component5_rest_certificate.py --component 5 --mask 255
