name: R22 research replay

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: r22-research-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase5-zero-closure:
    strategy:
      max-parallel: 1
      matrix:
        mask: [150, 255]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Close z0-zero branches by exact singleton/product propagation
        working-directory: experiments
        run: python r22_phase5_zero_closure.py --component 5 --mask ${{ matrix.mask }}

  phase5-rankdrop-certificate:
    strategy:
      max-parallel: 1
      matrix:
        mask: [150, 255]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Verify exact rank-drop local certificates
        working-directory: experiments
        run: python r22_phase5_component5_rest_certificate.py --component 5 --mask ${{ matrix.mask }}
