name: R22 research replay

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: r22-research-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-d0c0-mask0-local-relations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Re-derive component-13 mask-0 local scale relations from provenance
        working-directory: experiments
        run: python r22_phase5_component13_mask0_local_relations.py

  replay-d0c0-mask0-finite-census:
    needs: replay-d0c0-mask0-local-relations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Rebuild all 18 finite branches and assert the exact 2+4+4+8 stratification
        working-directory: experiments
        run: |
          python - <<'PY'
          import r22_phase5_component13_mask0_finite_census as fc
          import r22_phase5_monomial_lift as ml

          _quotient, unique = ml.compile_unique(fc.CID, fc.MASK)
          rows = [
              fc.branch_census(unique, a, b, sign)
              for b in range(3)
              for a in range(3)
              for sign in (1, -1)
          ]
          if len(rows) != 18:
              raise AssertionError(("finite branch count", len(rows)))
          by_id = {(r['a'], r['b'], r['sign']): r for r in rows}
          signs = ('+', '-')

          for sign in signs:
              r = by_id[(0, 0, sign)]
              if r['consistent']:
                  raise AssertionError(("expected affine inconsistency", r))

          for a in (1, 2):
              for sign in signs:
                  r = by_id[(a, 0, sign)]
                  if not (r['consistent'] and r['rank'] == 11 and r['free_dimension'] == 7 and r['forced_zero_z'] == (12, 13)):
                      raise AssertionError(("bad p-side rank11 branch", r))

          for b in (1, 2):
              for sign in signs:
                  r = by_id[(0, b, sign)]
                  if not (r['consistent'] and r['rank'] == 11 and r['free_dimension'] == 7 and r['forced_zero_z'] == (7, 8)):
                      raise AssertionError(("bad q-side rank11 branch", r))

          mixed = {(a,b,sign) for a in (1,2) for b in (1,2) for sign in signs}
          for key in mixed:
              r = by_id[key]
              if not (r['consistent'] and r['rank'] == 10 and r['free_dimension'] == 8 and r['forced_zero_z'] == ()):
                  raise AssertionError(("bad rank10 branch", r))

          print({
              'component': 13,
              'mask': 0,
              'total': 18,
              'affine_inconsistent': 2,
              'p_rank11': 4,
              'q_rank11': 4,
              'rank10': 8,
          })
          print("RESULT: component 13 / mask 0 finite stratification is exactly 18=2+4+4+8")
          PY

  replay-d0c0-mask0-forced-zero-invertibility:
    needs: replay-d0c0-mask0-finite-census
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Verify rank-11 forced zeros are not silently used as invertibility obstructions
        working-directory: experiments
        run: python r22_phase5_component13_mask0_forced_zero_invertibility.py

  replay-d0c0-mask0-p-rank11:
    needs: replay-d0c0-mask0-forced-zero-invertibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Close all four p-side rank-11 branches with one fixed source cell
        working-directory: experiments
        run: python r22_phase5_component13_mask0_p_rank11_certificate.py

  replay-d0c0-mask0-q-rank11:
    needs: replay-d0c0-mask0-p-rank11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Close all four q-side rank-11 branches with one fixed source cell
        working-directory: experiments
        run: python r22_phase5_component13_mask0_q_rank11_certificate.py

  replay-d0c0-mask0-rank10:
    needs: replay-d0c0-mask0-q-rank11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy z3-solver
      - name: Close all eight rank-10 branches with the universal three-cell certificate
        working-directory: experiments
        run: python r22_phase5_component13_mask0_rank10_certificate.py
